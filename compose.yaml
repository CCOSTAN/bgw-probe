services:
  bgw-probe:
    build: .
    container_name: bgw-probe
    restart: unless-stopped
    environment:
      BGW_URL: ${BGW_URL:-https://192.168.1.254}
      BGW_TIMEOUT_SECONDS: ${BGW_TIMEOUT_SECONDS:-8}
      BGW_POLL_INTERVAL_SECONDS: ${BGW_POLL_INTERVAL_SECONDS:-60}
      BGW_TLS_VERIFY: ${BGW_TLS_VERIFY:-false}
    ports:
      - "${BGW_LISTEN_ADDRESS:-127.0.0.1}:${BGW_LISTEN_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - -T
        - "5"
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
